[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "faker>=40.37.0",
    "numpy>=2.1,<2.3",
    "polars>=1.44.0",
    "pydantic>=2.13.4",
    "phonenumbers>=9.0.26",
    "rapidfuzz>=3.14.3",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "neo4j>=6.0.0",
    "shap>=0.48,<0.49",
    "catboost>=1.2.10",
    "scikit-learn>=1.9,<1.10",
    "langchain-core>=1.5,<1.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "deptry>=0.25.1",
    "ruff>=0.16.4",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.basedpyright]
include = ["main.py", "mayajaal", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.deptry]
known_first_party = ["mayajaal"]

# These are deliberately retained for future representation-learning work.
# All other missing, transitive, misplaced, and unused dependencies still fail.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "faker",
    "numpy",
    "polars",
    "scikit-learn", # dynamically imported only in mayajaal.interop.sklearn
    "torch",
    "torchaudio",
    "torchvision",
]
