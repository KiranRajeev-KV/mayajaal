services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/mayajaal
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${MAYAJAAL_POSTGRES_DB:-mayajaal}
      POSTGRES_USER: ${MAYAJAAL_POSTGRES_USER:-mayajaal}
      POSTGRES_PASSWORD: ${MAYAJAAL_POSTGRES_PASSWORD:-mayajaal-local-only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  neo4j_data:
  neo4j_plugins:
  postgres_data:
